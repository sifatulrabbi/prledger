<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prledger</title>
<style>
/* One column: header, sticky filter bar, groups as collapsible sections of wrapping card grids. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1d2330; --muted: #5d6676; --line: #dde1e8; --focus: #2f6feb; --warn-bg: #fff4e5;
  --open: #1a7f37; --draft: #6b7380; --merged: #8250df; --closed: #c4302b;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f1218; --surface: #171b23; --fg: #e4e8ef; --muted: #98a1b0; --line: #2a303b; --focus: #58a6ff; --warn-bg: #3a2a12;
  --open: #3fb950; --draft: #8b949e; --merged: #a371f7; --closed: #f85149; color-scheme: dark } }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.notice { background: var(--warn-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }

.bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-block: 10px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip, .btn { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.btn[disabled] { opacity: .6; cursor: progress; }
.chip[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
#q { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; flex: 1 1 220px; min-width: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸"; color: var(--muted); font-size: 12px; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
summary h2 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.tally { display: inline-flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tally span { display: inline-flex; gap: 4px; align-items: center; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; padding-block: 12px 4px; }
.card { display: grid; gap: 6px; align-content: start; min-width: 0; padding: 12px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--line); color: inherit; text-decoration: none; }
.card:hover { border-color: var(--muted); }
.card:hover .title { text-decoration: underline; }
.top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--c);
  border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; }
.title { font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.branch { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.dates { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding-block: 24px; }

[data-s="open"] { --c: var(--open); } [data-s="draft"] { --c: var(--draft); }
[data-s="merged"] { --c: var(--merged); } [data-s="closed"] { --c: var(--closed); }
@media (prefers-reduced-motion: reduce) { summary::before { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">prledger</h1>
      <div class="meta" id="meta">Loading pull requests…</div>
    </div>
    <button class="btn" id="refresh" type="button" hidden>Refresh</button>
  </header>
  <div class="notice" id="notice" hidden></div>
  <div class="bar" role="toolbar" aria-label="Filter pull requests">
    <div class="chips" id="chips"></div>
    <input id="q" type="search" placeholder="Search number, title or branch" aria-label="Search pull requests">
  </div>
  <main id="groups"></main>
</div>

<!-- `prledger export html` puts the snapshot JSON in this tag; `prledger serve` leaves it empty and the page fetches it. -->
<script id="prledger-data" type="application/json"></script>
<script>
"use strict";
const STATES = [["all", "All"], ["open", "Open"], ["draft", "Draft"], ["merged", "Merged"], ["closed", "Closed"]];
const LABEL = { open: "Open", draft: "Draft", merged: "Merged", closed: "Closed" };
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const day = iso => iso ? new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";

let snap = null;
let filter = store.get("prledger-filter") || "all";
if (!STATES.some(([k]) => k === filter)) filter = "all";

function notice(text) { const n = $("notice"); n.textContent = text || ""; n.hidden = !text; }

function setSnapshot(s) {
  snap = s;
  document.title = `${s.repo} · prledger`;
  $("title").textContent = s.repo;
  render();
}

function allPRs() { return snap ? snap.groups.flatMap(g => g.prs) : []; }

function renderMeta() {
  const prs = allPRs();
  const fetched = snap.fetchedAt ? new Date(snap.fetchedAt).toLocaleString() : "unknown";
  $("meta").textContent = `${prs.length} pull requests by ${snap.author} in ${snap.groups.length} groups · fetched ${fetched}`;
}

function renderChips() {
  const prs = allPRs();
  const chips = $("chips");
  chips.replaceChildren();
  for (const [key, label] of STATES) {
    const b = el("button", "chip");
    b.type = "button";
    b.setAttribute("aria-pressed", String(key === filter));
    if (key !== "all") { b.dataset.s = key; b.append(el("span", "dot")); }
    const n = key === "all" ? prs.length : prs.filter(p => p.status === key).length;
    b.append(label + " ", el("b", null, String(n)));
    b.addEventListener("click", () => { filter = key; store.set("prledger-filter", key); render(); });
    chips.append(b);
  }
}

function card(p) {
  const a = el("a", "card");
  a.href = p.url;
  a.target = "_blank";
  a.rel = "noopener";
  const top = el("div", "top");
  const pill = el("span", "pill", LABEL[p.status] || p.status);
  pill.dataset.s = p.status;
  top.append(el("span", "num", "#" + p.number), pill);
  let dates = "opened " + day(p.createdAt);
  if (p.status === "merged" && p.mergedAt) dates += " · merged " + day(p.mergedAt);
  else if (p.status === "closed" && p.closedAt) dates += " · closed " + day(p.closedAt);
  a.append(top, el("div", "title", p.title), el("div", "branch", p.branch), el("div", "dates", dates));
  return a;
}

function render() {
  if (!snap) return;
  renderMeta();
  renderChips();
  const term = $("q").value.trim().toLowerCase().replace(/^#/, "");
  const match = p => (filter === "all" || p.status === filter) &&
    (!term || String(p.number).includes(term) || p.title.toLowerCase().includes(term) || p.branch.toLowerCase().includes(term));
  const root = $("groups");
  root.replaceChildren();
  for (const g of snap.groups) {
    const shown = g.prs.filter(match);
    if (!shown.length) continue;
    const d = el("details");
    d.open = true;
    const sum = el("summary");
    sum.append(el("h2", null, g.name));
    const tally = el("span", "tally");
    tally.append(`${g.prs.length} PR${g.prs.length === 1 ? "" : "s"}`);
    for (const s of ["open", "draft", "merged", "closed"]) {
      const n = g.prs.filter(p => p.status === s).length;
      if (!n) continue;
      const t = el("span");
      t.dataset.s = s;
      t.append(el("i", "dot"), `${n} ${LABEL[s].toLowerCase()}`);
      tally.append(t);
    }
    sum.append(tally);
    const grid = el("div", "grid");
    shown.forEach(p => grid.append(card(p)));
    d.append(sum, grid);
    root.append(d);
  }
  if (!root.children.length) {
    root.append(el("p", "empty", allPRs().length
      ? "No pull requests match this filter. Clear the search or pick All."
      : "No pull requests yet. Open one and refresh."));
  }
}

$("q").addEventListener("input", render);

async function call(method, path) {
  const res = await fetch(path, { method, cache: "no-store", headers: { "X-Prledger": "1" } });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

// Refresh asks the server to run gh again. A failure keeps the data on screen.
async function refresh() {
  const btn = $("refresh");
  btn.disabled = true;
  btn.textContent = "Refreshing…";
  try {
    setSnapshot(await call("POST", "api/refresh"));
    notice("");
  } catch (err) {
    notice("Refresh failed, showing the last data: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Refresh";
  }
}

const STALE_MS = 60 * 1000;

async function load() {
  const embedded = $("prledger-data").textContent.trim();
  if (embedded) { setSnapshot(JSON.parse(embedded)); return; }
  $("refresh").hidden = false;
  $("refresh").addEventListener("click", refresh);
  try {
    setSnapshot(await call("GET", "api/snapshot"));
  } catch (err) {
    $("meta").textContent = "";
    notice("Could not load pull requests: " + err.message);
    return;
  }
  // A snapshot from the cache may be old; the server is already fetching.
  if (Date.now() - new Date(snap.fetchedAt).getTime() > STALE_MS) refresh();
}
load();
</script>
</body>
</html>
