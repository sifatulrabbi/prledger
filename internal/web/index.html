<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prledger</title>
<style>
/* One calm column: header, one row of filters, groups of cards. An open card has up to four lines:
   title, branch and labels, where it stands (CI, merge, review), and who said what. Done cards are one line. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1d2330; --muted: #5d6676; --line: #dde1e8; --focus: #2f6feb; --warn-bg: #fff4e5;
  --ok: #1a7f37; --bad: #c4302b; --wait: #9a6700; --merged: #8250df;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f1218; --surface: #171b23; --fg: #e4e8ef; --muted: #98a1b0; --line: #2a303b; --focus: #58a6ff; --warn-bg: #3a2a12;
  --ok: #3fb950; --bad: #f85149; --wait: #d29922; --merged: #a371f7; color-scheme: dark } }

* { box-sizing: border-box; }
[hidden] { display: none !important; } /* else .btn's display wins over the hidden attribute */
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.notice { background: var(--warn-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }

.bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-block: 10px;
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip, .btn { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.chip[aria-pressed="true"] b { color: var(--fg); }
.btn[disabled] { opacity: .6; cursor: progress; }
#q { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; flex: 1 1 200px; min-width: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

main { display: grid; gap: 28px; }
summary { cursor: pointer; display: flex; align-items: baseline; list-style: none; padding-block: 2px; }
.gname { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; min-width: 0; } /* a long name wraps beside the chevron, not under it */
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: 6px; height: 6px; align-self: center; margin-inline: 2px 4px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary::before { transform: rotate(45deg); }
summary h2 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.tally { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.list { display: grid; gap: 10px; padding-top: 12px; }
.card { display: grid; gap: 6px; padding: 12px 16px; border-radius: 8px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--edge, var(--line));
  margin-left: calc(min(var(--depth, 0), 4) * 16px); color: inherit; text-decoration: none; }
.card:hover .title { text-decoration: underline; }
.card[data-a="needs_you"] { --edge: var(--bad); } .card[data-a="approved"] { --edge: var(--ok); } .card[data-a="waiting"] { --edge: var(--wait); }
.row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; min-width: 0; }
.num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.title { font-size: 15px; font-weight: 500; flex: 1 1 24ch; min-width: 0; overflow-wrap: anywhere; }
.aside { margin-left: auto; display: inline-flex; gap: 10px; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.aside .tag { font-weight: 600; }
.branch { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.place { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.labels { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.label { font-size: 12px; line-height: 18px; padding: 0 8px; border-radius: 999px; max-width: 24ch;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border: 1px solid color-mix(in srgb, var(--lc, var(--muted)) 60%, transparent);
  background: color-mix(in srgb, var(--lc, var(--muted)) 16%, transparent); }
.more { font-size: 12px; color: var(--muted); }
.state, .people { font-size: 13px; gap: 2px 16px; }
.s { color: var(--k, var(--muted)); font-variant-numeric: tabular-nums; }
.who b { font-weight: 600; }
.who .s { margin-left: 4px; }
.people { padding-top: 6px; border-top: 1px dashed var(--line); }

/* Merged and closed PRs are history: one quiet line. */
.done { padding-block: 8px; gap: 0; }
.done .title { font-size: 14px; font-weight: 400; color: var(--muted); }
.done[data-s="merged"] .aside .tag { color: var(--merged); }

.empty { color: var(--muted); padding-block: 24px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[data-k="ok"] { --k: var(--ok); } [data-k="bad"] { --k: var(--bad); } [data-k="wait"] { --k: var(--wait); }
.tag[data-k] { color: var(--k); }

@media (max-width: 640px) {
  .wrap { padding-block: 20px 40px; gap: 16px; }
  .bar { position: static; } /* the chips wrap to several rows; sticking would cover a quarter of the screen */
  #q { flex-basis: 100%; }
  .card { padding: 10px 12px; margin-left: calc(min(var(--depth, 0), 3) * 8px); }
  .aside, .labels { margin-left: 0; }
  .labels { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { summary::before { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">prledger</h1>
      <div class="meta" id="meta">Loading pull requests…</div>
    </div>
    <button class="btn" id="refresh" type="button" hidden>Refresh</button>
  </header>
  <div class="notice" id="notice" hidden></div>
  <div class="bar" role="toolbar" aria-label="Filter pull requests">
    <div class="chips" id="chips"></div>
    <input id="q" type="search" placeholder="Search number, title, branch, label or person" aria-label="Search pull requests">
  </div>
  <main id="groups"></main>
</div>

<!-- `prledger export html` puts the snapshot JSON in this tag; `prledger serve` leaves it empty and the page fetches it. -->
<script id="prledger-data" type="application/json"></script>
<script>
"use strict";
const live = p => p.status === "open" || p.status === "draft";
// One filter at a time. Attention comes from core; Approved means every approved PR,
// even one that also needs you (say, approved but conflicting).
const FILTERS = [
  ["active", "Active", live],
  ["needs_you", "Needs you", p => p.attention === "needs_you"],
  ["approved", "Approved", p => live(p) && p.review === "approved"],
  ["waiting", "Waiting", p => p.attention === "waiting"],
  ["done", "Done", p => !live(p)],
  ["all", "All", () => true],
];
const MATCH = Object.fromEntries(FILTERS.map(([k, , f]) => [k, f]));
const ATTENTION = { needs_you: ["needs you", "bad"], approved: ["approved", "ok"], waiting: ["waiting", "wait"] };
const REVIEW = { approved: ["✓", "approved", "ok"], changes_requested: ["✗", "changes requested", "bad"], review_required: ["…", "review needed", "wait"] };
const MERGE = { conflicting: ["⊘", "conflicts", "bad"], behind: ["↓", "behind base", "wait"] };
const MAX_LABELS = 3, MAX_PEOPLE = 5;

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const day = iso => iso ? new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
function ago(iso) {
  const s = (new Date(iso) - Date.now()) / 1000;
  for (const [unit, n] of [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]]) {
    if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), unit);
  }
  return "just now";
}
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

// A signal is a glyph plus words, never color alone; screen readers get only the words.
function sig(glyph, words, k, title) {
  const s = el("span", "s");
  if (k) s.dataset.k = k;
  if (glyph) { const g = el("span", null, glyph + " "); g.setAttribute("aria-hidden", "true"); s.append(g); }
  s.append(words);
  if (title) s.title = title;
  return s;
}

let snap = null;
let filter = store.get("prledger-filter") || "active";
if (!(filter in MATCH)) filter = "active";

function notice(text) { const n = $("notice"); n.textContent = text || ""; n.hidden = !text; }

function setSnapshot(s) {
  snap = s;
  document.title = `${s.repo} · prledger`;
  $("title").textContent = s.repo;
  notice((s.warnings || []).join("\n"));
  render();
}

function allPRs() { return snap ? snap.groups.flatMap(g => g.prs) : []; }

function renderMeta(prs) {
  const fetched = snap.fetchedAt ? new Date(snap.fetchedAt).toLocaleString() : "unknown";
  $("meta").textContent = `${prs.length} pull requests by ${snap.author} in ${snap.groups.length} groups · fetched ${fetched}`;
}

function renderChips(prs) {
  $("chips").replaceChildren(...FILTERS.map(([key, label]) => {
    const b = el("button", "chip");
    b.type = "button";
    b.setAttribute("aria-pressed", String(key === filter));
    b.append(label, el("b", null, String(prs.filter(MATCH[key]).length)));
    b.addEventListener("click", () => { filter = key; store.set("prledger-filter", key); render(); });
    return b;
  }));
}

function place(g, i) {
  const e = g.stack.entries[i];
  const pos = `${i + 1}/${g.prs.length}`;
  if (e.on) return `${pos} · on #${e.on}`;
  const base = g.prs[i].base || snap.defaultBranch || "";
  if (g.stack.base) return "on " + base;
  return base ? `${pos} · on ${base}` : pos;
}

// where an open PR stands: CI, merge, GitHub's review decision. Trouble first.
function standing(p) {
  const out = [];
  const c = p.checks;
  if (c) {
    const total = c.passed + c.failed + c.pending;
    const counts = `${c.passed} passed, ${c.failed} failed, ${c.pending} running`;
    if (c.state === "fail") out.push(sig("✗", `${c.failed} of ${plural(total, "check")} failed`, "bad", counts));
    else if (c.state === "pending") out.push(sig("…", `${c.pending} of ${plural(total, "check")} running`, "wait", counts));
    else out.push(sig("✓", `${plural(total, "check")} passed`, "ok", counts));
  }
  if (MERGE[p.merge]) out.push(sig(...MERGE[p.merge]));
  if (REVIEW[p.review]) out.push(sig(...REVIEW[p.review]));
  const rank = { bad: 0, wait: 1, ok: 2 };
  return out.sort((a, b) => rank[a.dataset.k] - rank[b.dataset.k]);
}

// people is who said what, one entry per person: asked for changes, left threads open,
// approved, commented, still asked to review; then who else is assigned.
function people(p) {
  const by = new Map();
  const person = login => { if (!by.has(login)) by.set(login, { login, says: [], rank: 9, last: null }); return by.get(login); };
  const say = (login, rank, glyph, words, k) => { const x = person(login); x.says.push([glyph, words, k]); x.rank = Math.min(x.rank, rank); };
  for (const r of p.reviewers || []) {
    if (r.state === "changes_requested") say(r.login, 0, "✗", "requested changes", "bad");
    else if (r.state === "approved") say(r.login, 2, "✓", "approved", "ok");
  }
  for (const c of p.commenters || []) {
    if (c.unresolved) say(c.login, 1, "●", `${c.unresolved} unresolved`, "bad");
    if (c.comments) say(c.login, 3, "", plural(c.comments, "comment"), "");
    person(c.login).last = c.lastAt;
  }
  for (const r of p.reviewers || []) if (r.state === "requested") say(r.login, 4, "…", "review requested", "wait");
  for (const a of p.assignees || []) if (a !== p.author) say(a, 5, "", "assigned", ""); // authors mostly assign themselves

  const list = [...by.values()].sort((a, b) => a.rank - b.rank);
  if (!list.length) return null;
  const row = el("div", "row people");
  for (const x of list.slice(0, MAX_PEOPLE)) {
    const w = el("span", "who");
    w.append(el("b", null, x.login));
    x.says.forEach(([glyph, words, k], i) => { if (i) w.append(","); w.append(sig(glyph, words, k)); });
    w.title = `${x.login}: ${x.says.map(s => s[1]).join(", ")}` + (x.last ? ` · last comment ${ago(x.last)}` : "");
    row.append(w);
  }
  const rest = list.slice(MAX_PEOPLE);
  if (rest.length) { const m = el("span", "more", `+${rest.length} more`); m.title = rest.map(x => x.login).join(", "); row.append(m); }
  return row;
}

function labels(p) {
  const box = el("span", "labels");
  for (const l of p.labels.slice(0, MAX_LABELS)) {
    const s = el("span", "label", l.name);
    if (/^[0-9a-f]{6}$/i.test(l.color || "")) s.style.setProperty("--lc", "#" + l.color); // never raw CSS from data
    s.title = l.description ? `${l.name}: ${l.description}` : l.name;
    box.append(s);
  }
  const rest = p.labels.slice(MAX_LABELS);
  if (rest.length) { const m = el("span", "more", `+${rest.length}`); m.title = rest.map(l => l.name).join(", "); box.append(m); }
  return box;
}

function card(p, depth, where) {
  const open = live(p);
  const a = el("a", "card" + (open ? "" : " done"));
  a.href = /^https:\/\//.test(p.url) ? p.url : "#"; // never a javascript: link from edited data
  a.target = "_blank";
  a.rel = "noopener";
  a.dataset.s = p.status;
  if (depth) a.style.setProperty("--depth", String(depth));
  if (p.attention) a.dataset.a = p.attention;

  const aside = el("span", "aside");
  if (open) {
    if (ATTENTION[p.attention]) { const [text, k] = ATTENTION[p.attention]; const t = el("span", "tag", text); t.dataset.k = k; aside.append(t); }
    if (p.status === "draft") aside.append(el("span", "tag", "draft"));
    const w = el("span", null, ago(p.createdAt));
    w.title = "opened " + day(p.createdAt);
    aside.append(w);
  } else {
    const at = p.status === "merged" ? p.mergedAt : p.closedAt;
    aside.append(el("span", "tag", p.status));
    if (at) { const w = el("span", null, day(at)); w.title = `opened ${day(p.createdAt)} · ${p.status} ${day(at)}`; aside.append(w); }
  }
  const head = el("div", "row");
  head.append(el("span", "num", "#" + p.number), el("span", "title", p.title), aside);
  a.append(head);
  if (!open) return a;

  const sub = el("div", "row");
  if (where) sub.append(el("span", "place", where));
  // Show the base only when it is not the default branch; unknown default (old cache, failed lookup) shows none.
  const onBase = p.base && snap.defaultBranch && p.base !== snap.defaultBranch ? ` → ${p.base}` : "";
  sub.append(el("span", "branch", p.branch + onBase));
  a.append(sub);

  // Labels share the short standing line, not the branch line: branches of stacked PRs run long.
  const row = el("div", "row state");
  row.append(...standing(p));
  if (p.labels && p.labels.length) row.append(labels(p));
  if (row.childNodes.length) a.append(row);
  const who = people(p);
  if (who) a.append(who);
  return a;
}

function searchable(p) {
  return [String(p.number), p.title, p.branch, ...(p.labels || []).map(l => l.name), ...(p.reviewers || []).map(r => r.login),
    ...(p.commenters || []).map(c => c.login), ...(p.assignees || [])].join("\n").toLowerCase();
}

function render() {
  if (!snap) return;
  const prs = allPRs();
  renderMeta(prs);
  renderChips(prs);
  const term = $("q").value.trim().toLowerCase().replace(/^#/, "");
  const match = p => MATCH[filter](p) && (!term || searchable(p).includes(term));
  const root = $("groups");
  root.replaceChildren();
  for (const g of snap.groups) {
    const shown = g.prs.map((p, i) => [p, i]).filter(([p]) => match(p));
    if (!shown.length) continue;
    const d = el("details");
    d.open = true;
    const sum = el("summary");
    const name = el("span", "gname");
    name.append(el("h2", null, g.name));
    const tally = [g.stack ? "stack" : "", plural(g.prs.length, "PR")];
    const needs = g.prs.filter(p => p.attention === "needs_you").length;
    if (needs) tally.push(`${needs} need${needs === 1 ? "s" : ""} you`);
    name.append(el("span", "tally", tally.filter(Boolean).join(" · ")));
    sum.append(name);
    const list = el("div", "list");
    // In a stack, depth indents each PR under the one it sits on; a filtered-out parent leaves the indent as it is.
    shown.forEach(([p, i]) => list.append(card(p, g.stack ? g.stack.entries[i].depth : 0, g.stack ? place(g, i) : "")));
    d.append(sum, list);
    root.append(d);
  }
  if (!root.children.length) {
    root.append(el("p", "empty", prs.length
      ? "No pull requests match this filter. Clear the search or pick All."
      : "No pull requests yet. Open one and refresh."));
  }
}

$("q").addEventListener("input", render);

async function call(method, path) {
  const res = await fetch(path, { method, cache: "no-store", headers: { "X-Prledger": "1" } });
  const text = await res.text();
  let body = null;
  try { body = JSON.parse(text); } catch {}
  if (!res.ok) throw new Error((body && body.error) || text.trim() || res.statusText);
  if (body === null) throw new Error("the server sent something that is not JSON");
  return body;
}

async function refresh() {
  const btn = $("refresh");
  btn.disabled = true;
  btn.textContent = "Refreshing…";
  try {
    setSnapshot(await call("POST", "api/refresh")); // also shows or clears its warnings
  } catch (err) {
    notice("Refresh failed, showing the last data: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Refresh";
  }
}

const FRESH_MS = 10 * 1000;

async function load() {
  const embedded = $("prledger-data").textContent.trim();
  if (embedded) { setSnapshot(JSON.parse(embedded)); return; }
  $("refresh").hidden = false;
  $("refresh").addEventListener("click", refresh);
  try {
    setSnapshot(await call("GET", "api/snapshot"));
  } catch (err) {
    $("meta").textContent = "";
    notice("Could not load pull requests: " + err.message);
    return;
  }
  if (Date.now() - new Date(snap.fetchedAt).getTime() > FRESH_MS) refresh();
}
load();
</script>
</body>
</html>
