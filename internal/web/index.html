<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prledger</title>
<style>
/* One column: header, sticky filter bar, groups as collapsible sections of one-PR-per-line cards. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1d2330; --muted: #5d6676; --line: #dde1e8; --focus: #2f6feb; --warn-bg: #fff4e5;
  --open: #1a7f37; --draft: #6b7380; --merged: #8250df; --closed: #c4302b;
  --ok: #1a7f37; --bad: #c4302b; --wait: #9a6700;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f1218; --surface: #171b23; --fg: #e4e8ef; --muted: #98a1b0; --line: #2a303b; --focus: #58a6ff; --warn-bg: #3a2a12;
  --open: #3fb950; --draft: #8b949e; --merged: #a371f7; --closed: #f85149;
  --ok: #3fb950; --bad: #f85149; --wait: #d29922; color-scheme: dark } }

* { box-sizing: border-box; }
[hidden] { display: none !important; } /* else .btn's display wins over the hidden attribute */
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
h1 { margin: 0; font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.notice { background: var(--warn-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }

.bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-block: 10px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips + .chips { padding-left: 8px; border-left: 1px solid var(--line); }
.chip, .btn { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.btn[disabled] { opacity: .6; cursor: progress; }
.chip[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
#q { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; flex: 1 1 220px; min-width: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: 6px; height: 6px; align-self: center; margin-inline: 2px 4px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary::before { transform: rotate(45deg); }
summary h2 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.tally { display: inline-flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tally span { display: inline-flex; gap: 4px; align-items: center; }
.kind { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }

/* A card is one line of the list: what it is on the left, where it stands on the right. */
.list { display: grid; gap: 8px; padding-block: 12px 4px; }
.card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 20px; padding: 10px 12px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--edge, var(--line));
  margin-left: calc(var(--depth, 0) * 20px); color: inherit; text-decoration: none; }
.card:hover .title { text-decoration: underline; }
.card[data-a="needs_you"] { --edge: var(--bad); } .card[data-a="approved"] { --edge: var(--ok); } .card[data-a="waiting"] { --edge: var(--wait); }
.main { display: grid; gap: 5px; min-width: 0; align-content: start; }
.head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--c);
  border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; }
.tag { font-size: 12px; font-weight: 600; color: var(--k); }
.place { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.title { font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.done .title { font-weight: 400; color: var(--muted); }
.sub { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); }
.branch { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.when { font-variant-numeric: tabular-nums; }
.labels { display: flex; flex-wrap: wrap; gap: 4px; }
.label { font-size: 11.5px; line-height: 18px; padding: 0 8px; border-radius: 999px; max-width: 24ch;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border: 1px solid color-mix(in srgb, var(--lc, var(--muted)) 60%, transparent);
  background: color-mix(in srgb, var(--lc, var(--muted)) 16%, transparent); }
.more { font-size: 11.5px; color: var(--muted); align-self: center; }
.people { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.people b { font-weight: 500; color: var(--fg); }
.sig { display: grid; gap: 4px; align-content: start; justify-items: end; font-size: 12.5px; white-space: nowrap; }
.s { color: var(--k, var(--muted)); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding-block: 24px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

[data-s="open"] { --c: var(--open); } [data-s="draft"] { --c: var(--draft); }
[data-s="merged"] { --c: var(--merged); } [data-s="closed"] { --c: var(--closed); }
[data-k="ok"] { --k: var(--ok); } [data-k="bad"] { --k: var(--bad); } [data-k="wait"] { --k: var(--wait); }
@media (max-width: 640px) {
  .bar { position: static; } /* the chips wrap to several rows; sticking would cover a quarter of the screen */
  .card { grid-template-columns: minmax(0, 1fr); margin-left: calc(min(var(--depth, 0), 4) * 10px); }
  .sig { display: flex; flex-wrap: wrap; gap: 4px 12px; white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { summary::before { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">prledger</h1>
      <div class="meta" id="meta">Loading pull requests…</div>
    </div>
    <button class="btn" id="refresh" type="button" hidden>Refresh</button>
  </header>
  <div class="notice" id="notice" hidden></div>
  <div class="bar" role="toolbar" aria-label="Filter pull requests">
    <div class="chips" id="states"></div>
    <div class="chips" id="focus"></div>
    <input id="q" type="search" placeholder="Search number, title, branch, label or person" aria-label="Search pull requests">
  </div>
  <main id="groups"></main>
</div>

<!-- `prledger export html` puts the snapshot JSON in this tag; `prledger serve` leaves it empty and the page fetches it. -->
<script id="prledger-data" type="application/json"></script>
<script>
"use strict";
const live = p => p.status === "open" || p.status === "draft";
// Filters are one choice: a state, or where an open PR stands (attention comes from core).
// Approved means every approved PR, even one that also needs you (say, approved but conflicting).
const STATES = [["active", "Active", live], ["open", "Open"], ["draft", "Draft"], ["merged", "Merged"], ["closed", "Closed"], ["all", "All", () => true]];
const FOCUS = [
  ["needs_you", "Needs you", "bad", p => p.attention === "needs_you"],
  ["approved", "Approved", "ok", p => live(p) && p.review === "approved"],
  ["waiting", "Waiting", "wait", p => p.attention === "waiting"],
];
const FILTERS = Object.fromEntries([
  ...STATES.map(([k, , f]) => [k, f || (p => p.status === k)]),
  ...FOCUS.map(([k, , , f]) => [k, f]),
]);
const LABEL = { open: "Open", draft: "Draft", merged: "Merged", closed: "Closed" };
const ATTENTION = { needs_you: ["needs you", "bad"], approved: ["approved", "ok"], waiting: ["waiting", "wait"] };
const REVIEW = { approved: ["✓ approved", "ok"], changes_requested: ["✗ changes requested", "bad"], review_required: ["… review needed", "wait"] };
const MERGE = { conflicting: ["⊘ conflicts", "bad"], behind: ["↓ behind base", "wait"] };
const REVIEWER = { approved: ["✓", "approved"], changes_requested: ["✗", "requested changes"], requested: ["…", "review requested"] };
const MAX_LABELS = 4, MAX_PEOPLE = 4;

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const day = iso => iso ? new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
function ago(iso) {
  const s = (new Date(iso) - Date.now()) / 1000;
  for (const [unit, n] of [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]]) {
    if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), unit);
  }
  return "just now";
}

let snap = null;
let filter = store.get("prledger-filter") || "active";
if (!(filter in FILTERS)) filter = "active";

function notice(text) { const n = $("notice"); n.textContent = text || ""; n.hidden = !text; }

function setSnapshot(s) {
  snap = s;
  document.title = `${s.repo} · prledger`;
  $("title").textContent = s.repo;
  notice((s.warnings || []).join("\n"));
  render();
}

function allPRs() { return snap ? snap.groups.flatMap(g => g.prs) : []; }

function renderMeta(prs) {
  const fetched = snap.fetchedAt ? new Date(snap.fetchedAt).toLocaleString() : "unknown";
  $("meta").textContent = `${prs.length} pull requests by ${snap.author} in ${snap.groups.length} groups · fetched ${fetched}`;
}

function renderChips(prs) {
  const chip = (key, label, s, k) => {
    const b = el("button", "chip");
    b.type = "button";
    b.setAttribute("aria-pressed", String(key === filter));
    if (s) { b.dataset.s = s; b.append(el("span", "dot")); }
    if (k) { b.dataset.k = k; b.style.setProperty("--c", `var(--k)`); b.append(el("span", "dot")); }
    b.append(label + " ", el("b", null, String(prs.filter(FILTERS[key]).length)));
    b.addEventListener("click", () => { filter = key; store.set("prledger-filter", key); render(); });
    return b;
  };
  $("states").replaceChildren(...STATES.map(([key, label]) => chip(key, label, LABEL[key] && key)));
  $("focus").replaceChildren(...FOCUS.map(([key, label, k]) => chip(key, label, null, k)));
}

function place(g, i) {
  const e = g.stack.entries[i];
  const pos = `${i + 1}/${g.prs.length}`;
  if (e.on) return `${pos} · on #${e.on}`;
  const base = g.prs[i].base || snap.defaultBranch || "";
  if (g.stack.base) return "on " + base;
  return base ? `${pos} · on ${base}` : pos;
}

// signals is where an open PR stands: CI, review, merge. Each is a glyph plus words, never color alone.
function signals(p) {
  const out = [];
  const add = ([text, k], title) => { const s = el("span", "s", text); s.dataset.k = k; if (title) s.title = title; out.push(s); };
  const c = p.checks;
  if (c) {
    const total = c.passed + c.failed + c.pending;
    const counts = `${c.passed} passed, ${c.failed} failed, ${c.pending} running`;
    if (c.state === "fail") add([`✗ ${c.failed} of ${total} checks failed`, "bad"], counts);
    else if (c.state === "pending") add([`… ${c.pending} of ${total} checks running`, "wait"], counts);
    else add([`✓ ${total} checks passed`, "ok"], counts);
  }
  if (REVIEW[p.review]) add(REVIEW[p.review]);
  if (MERGE[p.merge]) add(MERGE[p.merge]);
  return out;
}

function labels(p) {
  const box = el("div", "labels");
  for (const l of p.labels.slice(0, MAX_LABELS)) {
    const s = el("span", "label", l.name);
    if (/^[0-9a-f]{6}$/i.test(l.color || "")) s.style.setProperty("--lc", "#" + l.color); // never raw CSS from data
    s.title = l.description ? `${l.name}: ${l.description}` : l.name;
    box.append(s);
  }
  const rest = p.labels.slice(MAX_LABELS);
  if (rest.length) { const m = el("span", "more", `+${rest.length}`); m.title = rest.map(l => l.name).join(", "); box.append(m); }
  return box;
}

function people(p) {
  const line = el("div", "people");
  const names = (title, list, render) => {
    if (!list.length) return;
    if (line.childNodes.length) line.append(" · ");
    line.append(title + " ");
    list.slice(0, MAX_PEOPLE).forEach((x, i) => { if (i) line.append(", "); line.append(render(x)); });
    const rest = list.slice(MAX_PEOPLE);
    if (rest.length) { const m = el("span", null, ` +${rest.length}`); m.title = rest.map(x => x.login || x).join(", "); line.append(m); }
  };
  names("review", p.reviewers || [], r => {
    const [glyph, said] = REVIEWER[r.state] || ["", r.state];
    const b = el("b", null, r.login + " ");
    const g = el("span", null, glyph);
    g.setAttribute("aria-hidden", "true");
    b.append(g, el("span", "sr", ` (${said})`)); // screen readers say the words, not "check mark"
    b.title = `${r.login}: ${said}`;
    return b;
  });
  // Authors mostly assign themselves; only someone else is news.
  names("assigned", (p.assignees || []).filter(a => a !== p.author), a => el("b", null, a));
  return line.childNodes.length ? line : null;
}

function card(p, depth, where) {
  const a = el("a", "card" + (live(p) ? "" : " done"));
  a.href = /^https:\/\//.test(p.url) ? p.url : "#"; // never a javascript: link from edited data
  a.target = "_blank";
  a.rel = "noopener";
  if (depth) a.style.setProperty("--depth", String(Math.min(depth, 8)));
  if (p.attention) a.dataset.a = p.attention;

  const head = el("div", "head");
  const pill = el("span", "pill", LABEL[p.status] || p.status);
  pill.dataset.s = p.status;
  head.append(el("span", "num", "#" + p.number), pill);
  if (ATTENTION[p.attention]) { const [text, k] = ATTENTION[p.attention]; const t = el("span", "tag", text); t.dataset.k = k; head.append(t); }
  if (where) head.append(el("span", "place", where));

  const sub = el("div", "sub");
  // Show the base only when it is not the default branch; unknown default (old cache, failed lookup) shows none.
  const onBase = p.base && snap.defaultBranch && p.base !== snap.defaultBranch ? ` → ${p.base}` : "";
  sub.append(el("span", "branch", p.branch + onBase));
  let when = "opened " + ago(p.createdAt), full = "opened " + day(p.createdAt);
  if (p.status === "merged" && p.mergedAt) { when = "merged " + day(p.mergedAt); full += " · " + when; }
  else if (p.status === "closed" && p.closedAt) { when = "closed " + day(p.closedAt); full += " · " + when; }
  const w = el("span", "when", when);
  w.title = full;
  sub.append(w);

  const main = el("div", "main");
  main.append(head, el("div", "title", p.title), sub);
  if (p.labels && p.labels.length) main.append(labels(p));
  if (live(p)) { const who = people(p); if (who) main.append(who); }
  a.append(main);
  const sig = live(p) ? signals(p) : [];
  if (sig.length) { const box = el("div", "sig"); box.append(...sig); a.append(box); }
  return a;
}

function searchable(p) {
  return [String(p.number), p.title, p.branch,
    ...(p.labels || []).map(l => l.name), ...(p.reviewers || []).map(r => r.login), ...(p.assignees || [])].join("\n").toLowerCase();
}

function render() {
  if (!snap) return;
  const prs = allPRs();
  renderMeta(prs);
  renderChips(prs);
  const term = $("q").value.trim().toLowerCase().replace(/^#/, "");
  const match = p => FILTERS[filter](p) && (!term || searchable(p).includes(term));
  const root = $("groups");
  root.replaceChildren();
  for (const g of snap.groups) {
    const shown = g.prs.map((p, i) => [p, i]).filter(([p]) => match(p));
    if (!shown.length) continue;
    const d = el("details");
    d.open = true;
    const sum = el("summary");
    sum.append(el("h2", null, g.name));
    if (g.stack) sum.append(el("span", "kind", "stack"));
    const tally = el("span", "tally");
    tally.append(`${g.prs.length} PR${g.prs.length === 1 ? "" : "s"}`);
    for (const s of ["open", "draft", "merged", "closed"]) {
      const n = g.prs.filter(p => p.status === s).length;
      if (!n) continue;
      const t = el("span");
      t.dataset.s = s;
      t.append(el("i", "dot"), `${n} ${LABEL[s].toLowerCase()}`);
      tally.append(t);
    }
    const needs = g.prs.filter(p => p.attention === "needs_you").length;
    if (needs) { const t = el("span", "s", `✗ ${needs} need${needs === 1 ? "s" : ""} you`); t.dataset.k = "bad"; tally.append(t); }
    sum.append(tally);
    const list = el("div", "list");
    // In a stack, depth indents each PR under the one it sits on; a filtered-out parent leaves the indent as it is.
    shown.forEach(([p, i]) => list.append(card(p, g.stack ? g.stack.entries[i].depth : 0, g.stack ? place(g, i) : "")));
    d.append(sum, list);
    root.append(d);
  }
  if (!root.children.length) {
    root.append(el("p", "empty", prs.length
      ? "No pull requests match this filter. Clear the search or pick All."
      : "No pull requests yet. Open one and refresh."));
  }
}

$("q").addEventListener("input", render);

async function call(method, path) {
  const res = await fetch(path, { method, cache: "no-store", headers: { "X-Prledger": "1" } });
  const text = await res.text();
  let body = null;
  try { body = JSON.parse(text); } catch {}
  if (!res.ok) throw new Error((body && body.error) || text.trim() || res.statusText);
  if (body === null) throw new Error("the server sent something that is not JSON");
  return body;
}

async function refresh() {
  const btn = $("refresh");
  btn.disabled = true;
  btn.textContent = "Refreshing…";
  try {
    setSnapshot(await call("POST", "api/refresh")); // also shows or clears its warnings
  } catch (err) {
    notice("Refresh failed, showing the last data: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Refresh";
  }
}

const FRESH_MS = 10 * 1000;

async function load() {
  const embedded = $("prledger-data").textContent.trim();
  if (embedded) { setSnapshot(JSON.parse(embedded)); return; }
  $("refresh").hidden = false;
  $("refresh").addEventListener("click", refresh);
  try {
    setSnapshot(await call("GET", "api/snapshot"));
  } catch (err) {
    $("meta").textContent = "";
    notice("Could not load pull requests: " + err.message);
    return;
  }
  if (Date.now() - new Date(snap.fetchedAt).getTime() > FRESH_MS) refresh();
}
load();
</script>
</body>
</html>
